name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 for Python
        run: pip install lupa
      - name: Run the scenario tests
        run: python tests/run.py
      - name: Build the zip
        run: python tools/package.py --no-tests
      - uses: actions/upload-artifact@v4
        with:
          name: Earshot-zip
          path: dist/*.zip
