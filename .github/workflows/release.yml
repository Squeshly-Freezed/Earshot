name: Release

# When you publish a release on GitHub, tagged v<version>, this runs the tests, builds
# Earshot-<version>.zip and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 for Python
        run: pip install lupa
      - name: Run the tests and build the zip
        run: python tools/package.py
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip="dist/Earshot-${TAG#v}.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::The tag $TAG doesn't match the version in Earshot.toc."
            exit 1
          fi
          gh release upload "$TAG" "$zip" --clobber
